name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # One Linux run and one Windows run on the same profile. Windows is a permanent gate because
    # text-mode file writes rewrite LF as CRLF there, which previously desynchronized integrity
    # hashes for generated FAP projects and evidence artifacts without failing on Ubuntu.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package and test tools
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Repository test gate
        run: python scripts/test_harness.py ci
