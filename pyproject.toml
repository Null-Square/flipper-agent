[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hardware-pentest-agent"
version = "0.0.1"
description = "Agent-native runtime for authorized hardware and embedded security testing"
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "NullSquare" }
]
dependencies = [
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
serial = [
  "pyserial>=3.5",
]
usb = [
  "pyusb>=1.3",
]
flipper = [
  "pyserial>=3.5",
]
mcp = [
  "mcp>=2,<3",
]
dev = [
  "mcp>=2,<3",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
hardware-pentest = "hardware_pentest.interfaces.cli:main"
hardware-pentest-preflight = "hardware_pentest.interfaces.preflight_cli:main"
hardware-pentest-wifi-setup = "hardware_pentest.interfaces.wifi_setup_cli:main"
hardware-pentest-mcp = "hardware_pentest.interfaces.mcp_server:main"
hardware-pentest-operator = "hardware_pentest.interfaces.operator_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hardware_pentest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "contract: protocol/compatibility and fault-injection tests that require no physical hardware",
  "hil: opt-in hardware-in-the-loop tests that may open configured local serial devices",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
